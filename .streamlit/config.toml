# NegoTrain app theme and client settings (read by `streamlit run` from the repo root).
# The palette is shared with src/negotrain/app/style.py (CSS variables): warm neutrals,
# near-black text, and one deep-green accent. Keep the two in sync.

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [650, 650, 600, 600, 600, 600]
baseFontSize = 16
primaryColor = "#1F5C4A"
backgroundColor = "#FBFAF8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1B19"
linkColor = "#1F5C4A"
borderColor = "#E0DED7"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.55rem"
metricValueFontWeight = 650
dataframeHeaderBackgroundColor = "#F4F3EF"
greenColor = "#2D6A47"
redColor = "#A3271F"
orangeColor = "#8A5300"
yellowColor = "#8A5300"
blueColor = "#2F4A7A"
chartCategoricalColors = ["#1F5C4A", "#8A5300", "#2F4A7A", "#A3271F", "#6B7F3A", "#7A5C8F"]

[theme.sidebar]
backgroundColor = "#F4F3EF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1B19"
borderColor = "#E0DED7"
primaryColor = "#1F5C4A"
